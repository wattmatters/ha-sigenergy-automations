alias: "SIGEN - AEMO CRITICAL EVENT EXPORT CONTROL"
description: >-
  Manages battery export during AEMO critical price events using the AEMO NEM
  Web HACS integration. Monitors the realtime price with a predictive
  pre-alert from the 5-minute forecast. Intervenes only when not already
  exporting at the maximum rate. Shared as an example — adapt sensor IDs,
  time windows and limits to your own system.

# ─────────────────────────────────────────────────────────────────
# CONFIGURATION — edit these to match your system
# ─────────────────────────────────────────────────────────────────
#
# ← REPLACE all entity IDs and device_id values with your own.
# Use Developer Tools → States to find the correct entity IDs.
#
# AEMO region sensor prefix: sensor.aemo_nemweb_<REGION>_
#   e.g. NSW1 → sensor.aemo_nemweb_nsw1_realtime_price
#        VIC1 → sensor.aemo_nemweb_vic1_realtime_price
#
# Hardware actions (Remote EMS switch, operating mode select) use device
# actions, so they need YOUR_SIGEN_DEVICE_ID plus the entity registry ID
# of each entity. State CHECKS use normal entity IDs.
#
# input_boolean.aemo_critical_override_active is the flag the Battery
# Control Ownership State Machine reads to give this automation top
# priority. It is deliberately turned off LAST in each exit path, only
# after the hardware has been handed back, so ownership does not pass to
# another automation while this one is still mid-restore.
#
# Key values to adjust:
#   - Peak export window (17:59:50–20:00:00)
#   - Cheap/free-rate charging window (10:59:50–14:00:00)
#   - Minimum battery reserve (5 kWh)
#   - Maximum export limit (5 kW)
#
# ─────────────────────────────────────────────────────────────────

variables:
  # ← REPLACE region prefix as needed (nsw1, vic1, sa1, qld1, etc.)
  # The sensor reports $/kWh; multiplied by 1000 for $/MWh display values.
  realtime_price_mwh: >-
    {{ (states('sensor.aemo_nemweb_nsw1_realtime_price') | float(0) * 1000) | round(0) }}
  forecast_price_mwh: >-
    {{ (states('sensor.aemo_nemweb_nsw1_5min_forecast') | float(0) * 1000) | round(0) }}
  critical_threshold: >-
    {{ states('input_number.aemo_critical_price_threshold') | float(3) }}
  pre_alert_threshold: >-
    {{ states('input_number.aemo_pre_alert_price_threshold') | float(2) }}

mode: queued
max: 5

triggers:
  - trigger: template
    id: critical_event_start
    value_template: >-
      {{ states('sensor.aemo_nemweb_nsw1_realtime_price') | float(0) >
         states('input_number.aemo_critical_price_threshold') | float(3) }}
    # ← REPLACE region

  - trigger: template
    id: critical_event_end
    value_template: >-
      {{ states('sensor.aemo_nemweb_nsw1_realtime_price') | float(0) <
         states('input_number.aemo_critical_price_threshold') | float(3) }}
    # ← REPLACE region

  - trigger: template
    id: pre_alert_start
    value_template: >-
      {{ states('sensor.aemo_nemweb_nsw1_5min_forecast') | float(0) >
         states('input_number.aemo_pre_alert_price_threshold') | float(2) }}
    # ← REPLACE region

  - trigger: template
    id: pre_alert_end
    value_template: >-
      {{ states('sensor.aemo_nemweb_nsw1_5min_forecast') | float(0) <
         states('input_number.aemo_pre_alert_price_threshold') | float(2) }}
    # ← REPLACE region

  - trigger: time_pattern
    minutes: "/1"
    id: monitor_during_event

conditions: []

actions:
  - choose:

      # ── CRITICAL EVENT START ─────────────────────────────────────
      - conditions:
          - condition: trigger
            id: critical_event_start
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.aemo_critical_event

          # Only proceed if sufficient battery charge remains.
          # NOTE: a failed condition step ends this run, so the "Insufficient
          # Battery" default notification in the choose block below is only
          # reachable if this condition is moved inside the choose.
          - condition: numeric_state
            entity_id: sensor.sigen_0_inverter_1_available_battery_discharge_energy  # ← REPLACE
            above: 5  # kWh — adjust your minimum reserve

          - choose:

              # Scenario A: already exporting at max during the peak window — no action needed
              - conditions:
                  - condition: time
                    after: "17:59:50"
                    before: "20:00:00"  # ← ADJUST to your peak export window
                  - condition: state
                    entity_id: switch.sigen_0_plant_remote_ems  # ← REPLACE
                    state: "on"
                  - condition: template
                    value_template: >-
                      {{ states('number.sigen_0_plant_grid_max_export_limit') | float >= 4.5 }}
                    # ← REPLACE entity; ~90% of your max export limit
                sequence:
                  - action: persistent_notification.create
                    data:
                      notification_id: aemo_critical_status
                      title: "✅ AEMO Critical - Already Exporting"
                      message: >-
                        Critical event detected at ${{ realtime_price_mwh }}/MWh.
                        Already exporting at maximum rate during peak period. No intervention needed.

              # Scenario B: cheap-rate charging window — override charging and export
              - conditions:
                  - condition: time
                    after: "10:59:50"
                    before: "14:00:00"  # ← ADJUST to your cheap/free-rate window
                  - condition: state
                    entity_id: switch.sigen_0_plant_remote_ems  # ← REPLACE
                    state: "on"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.aemo_critical_override_active
                  - action: number.set_value
                    data:
                      value: 0
                    target:
                      entity_id: number.sigen_0_plant_max_charging_limit  # ← REPLACE
                  - delay: "00:00:02"
                  # ← REPLACE device_id, entity_id and option with your SIGEN mode select
                  - device_id: YOUR_SIGEN_DEVICE_ID
                    domain: select
                    entity_id: YOUR_SIGEN_OPERATING_MODE_SELECT_ENTITY_ID
                    type: select_option
                    option: "Command Discharging (Output power from PV first)"
                  - delay: "00:00:02"
                  - action: number.set_value
                    data:
                      value: 5  # ← REPLACE with your maximum export limit in kW
                    target:
                      entity_id: number.sigen_0_plant_grid_max_export_limit  # ← REPLACE
                  - action: persistent_notification.create
                    data:
                      notification_id: aemo_critical_status
                      title: "⚡ AEMO Critical - Override Active"
                      message: >-
                        Critical event at ${{ realtime_price_mwh }}/MWh.
                        Overriding charging mode - switched to EXPORT.
                        Battery discharging at maximum rate to grid.

              # Scenario C: Remote EMS is off — enable it and start exporting
              - conditions:
                  - condition: template
                    value_template: "{{ states('switch.sigen_0_plant_remote_ems') == 'off' }}"  # ← REPLACE
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.aemo_critical_override_active
                  # ← REPLACE device_id and entity_id with your Remote EMS switch
                  - type: turn_on
                    device_id: YOUR_SIGEN_DEVICE_ID
                    entity_id: YOUR_SIGEN_REMOTE_EMS_SWITCH_ENTITY_ID
                    domain: switch
                  - alias: "Settle wait after Remote EMS on"
                    wait_template: "{{ states('select.sigen_0_plant_remote_ems_control_mode') not in ['unavailable', 'unknown'] }}"  # ← REPLACE
                    timeout: "00:00:30"
                    continue_on_timeout: true
                  # ← REPLACE device_id, entity_id and option with your SIGEN mode select
                  - device_id: YOUR_SIGEN_DEVICE_ID
                    domain: select
                    entity_id: YOUR_SIGEN_OPERATING_MODE_SELECT_ENTITY_ID
                    type: select_option
                    option: "Command Discharging (Output power from PV first)"
                    continue_on_error: true
                  - action: number.set_value
                    data:
                      value: 5  # ← REPLACE
                    target:
                      entity_id: number.sigen_0_plant_grid_max_export_limit  # ← REPLACE
                    continue_on_error: true
                  - action: persistent_notification.create
                    data:
                      notification_id: aemo_critical_status
                      title: "⚡ AEMO Critical - Export Enabled"
                      message: >-
                        Critical event at ${{ realtime_price_mwh }}/MWh.
                        Enabled Remote EMS and battery export.
                        Battery discharging at maximum rate to grid.

              # Scenario D: Remote EMS on but export rate too low — increase it
              - conditions:
                  - condition: state
                    entity_id: switch.sigen_0_plant_remote_ems  # ← REPLACE
                    state: "on"
                  - condition: template
                    value_template: >-
                      {{ states('number.sigen_0_plant_grid_max_export_limit') | float < 4.5 }}
                    # ← REPLACE entity
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.aemo_critical_override_active
                  - action: number.set_value
                    data:
                      value: 5  # ← REPLACE
                    target:
                      entity_id: number.sigen_0_plant_grid_max_export_limit  # ← REPLACE
                  - action: persistent_notification.create
                    data:
                      notification_id: aemo_critical_status
                      title: "⚡ AEMO Critical - Rate Increased"
                      message: >-
                        Critical event at ${{ realtime_price_mwh }}/MWh.
                        Increased export rate to maximum (5 kW).

            # Default: battery too low (see NOTE on the condition above)
            default:
              - action: persistent_notification.create
                data:
                  notification_id: aemo_critical_status
                  title: "⚠️ AEMO Critical - Insufficient Battery"
                  message: >-
                    Critical event at ${{ realtime_price_mwh }}/MWh.
                    Battery too low to export
                    ({{ states('sensor.sigen_0_inverter_1_available_battery_discharge_energy') }} kWh available).
                    Minimum 5 kWh reserve maintained for backup power.

          # Record the current spot price, clamped to the helper's own min/max
          - action: input_number.set_value
            continue_on_error: true
            target:
              entity_id: input_number.aemo_nsw_spot_price  # ← REPLACE if different
            data:
              value: >-
                {{ [[realtime_price_mwh | float(0), state_attr('input_number.aemo_nsw_spot_price', 'max') | float(30000)] | min,
                    state_attr('input_number.aemo_nsw_spot_price', 'min') | float(-1000)] | max }}

      # ── PRE-ALERT START ──────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: pre_alert_start
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.aemo_pre_alert
          - action: persistent_notification.create
            data:
              notification_id: aemo_pre_alert_status
              title: "⚠️ AEMO Pre-Alert Active"
              message: >-
                Price forecast: ${{ forecast_price_mwh }}/MWh
                Realtime: ${{ realtime_price_mwh }}/MWh
                Forecast indicates potential critical event approaching.
                Monitor battery charge status - may need to preserve capacity for export.

      # ── PRE-ALERT END ────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: pre_alert_end
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.aemo_pre_alert
          - action: persistent_notification.dismiss
            data:
              notification_id: aemo_pre_alert_status

      # ── 1-MINUTE MONITOR (while an override is active) ───────────
      - conditions:
          - condition: trigger
            id: monitor_during_event
          - condition: state
            entity_id: input_boolean.aemo_critical_event
            state: "on"
          - condition: state
            entity_id: input_boolean.aemo_critical_override_active
            state: "on"
        sequence:
          - action: input_number.set_value
            continue_on_error: true
            target:
              entity_id: input_number.aemo_nsw_spot_price  # ← REPLACE if different
            data:
              value: >-
                {{ [[realtime_price_mwh | float(0), state_attr('input_number.aemo_nsw_spot_price', 'max') | float(30000)] | min,
                    state_attr('input_number.aemo_nsw_spot_price', 'min') | float(-1000)] | max }}

          - choose:
              # Battery hit the minimum reserve — stop exporting and hand back
              - conditions:
                  - condition: numeric_state
                    entity_id: sensor.sigen_0_inverter_1_available_battery_discharge_energy  # ← REPLACE
                    below: 5  # ← Match your minimum reserve
                sequence:
                  # ← REPLACE device_id, entity_id and option
                  - device_id: YOUR_SIGEN_DEVICE_ID
                    domain: select
                    entity_id: YOUR_SIGEN_OPERATING_MODE_SELECT_ENTITY_ID
                    type: select_option
                    option: "Maximum Self-consumption (Default)"
                    continue_on_error: true
                  - delay: "00:00:02"
                  # ← REPLACE device_id and entity_id with your Remote EMS switch
                  - type: turn_off
                    device_id: YOUR_SIGEN_DEVICE_ID
                    entity_id: YOUR_SIGEN_REMOTE_EMS_SWITCH_ENTITY_ID
                    domain: switch
                    continue_on_error: true
                  - alias: "Wait for Remote EMS to report off before handing control back"
                    wait_template: "{{ is_state('switch.sigen_0_plant_remote_ems', 'off') }}"  # ← REPLACE
                    timeout: "00:00:10"
                    continue_on_timeout: true
                  - action: persistent_notification.create
                    data:
                      notification_id: aemo_critical_status
                      title: "🛑 AEMO Critical - Battery Low"
                      message: >-
                        Battery reached minimum safe level
                        ({{ states('sensor.sigen_0_inverter_1_available_battery_discharge_energy') }} kWh).
                        Export stopped to maintain 5 kWh backup reserve.
                        Event still active at ${{ realtime_price_mwh }}/MWh.
                    continue_on_error: true
                  # Override flag goes off LAST, after the hardware hand-back
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.aemo_critical_override_active

              # Hardware has drifted from the override state — re-assert it
              - alias: "Re-assert override hardware state if Remote EMS, control mode or export limit has drifted"
                conditions:
                  - condition: or
                    conditions:
                      - condition: numeric_state
                        entity_id: number.sigen_0_plant_grid_max_export_limit  # ← REPLACE
                        below: 4.5
                      - condition: state
                        entity_id: switch.sigen_0_plant_remote_ems  # ← REPLACE
                        state: "off"
                      - condition: not
                        conditions:
                          - condition: state
                            entity_id: select.sigen_0_plant_remote_ems_control_mode  # ← REPLACE
                            state: "Command Discharging (Output power from PV first)"
                sequence:
                  - if:
                      - condition: state
                        entity_id: switch.sigen_0_plant_remote_ems  # ← REPLACE
                        state: "off"
                    then:
                      # ← REPLACE device_id and entity_id with your Remote EMS switch
                      - type: turn_on
                        device_id: YOUR_SIGEN_DEVICE_ID
                        entity_id: YOUR_SIGEN_REMOTE_EMS_SWITCH_ENTITY_ID
                        domain: switch
                      - alias: "Settle wait after Remote EMS on"
                        wait_template: "{{ states('select.sigen_0_plant_remote_ems_control_mode') not in ['unavailable', 'unknown'] }}"  # ← REPLACE
                        timeout: "00:00:30"
                        continue_on_timeout: true
                  - if:
                      - condition: not
                        conditions:
                          - condition: state
                            entity_id: select.sigen_0_plant_remote_ems_control_mode  # ← REPLACE
                            state: "Command Discharging (Output power from PV first)"
                    then:
                      # ← REPLACE device_id, entity_id and option
                      - device_id: YOUR_SIGEN_DEVICE_ID
                        domain: select
                        entity_id: YOUR_SIGEN_OPERATING_MODE_SELECT_ENTITY_ID
                        type: select_option
                        option: "Command Discharging (Output power from PV first)"
                        continue_on_error: true
                  - action: number.set_value
                    data:
                      value: 5  # ← REPLACE
                    target:
                      entity_id: number.sigen_0_plant_grid_max_export_limit  # ← REPLACE
                    continue_on_error: true

      # ── CRITICAL EVENT END ───────────────────────────────────────
      - conditions:
          - condition: trigger
            id: critical_event_end
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.aemo_critical_event
          - action: input_number.set_value
            continue_on_error: true
            target:
              entity_id: input_number.aemo_nsw_spot_price  # ← REPLACE if different
            data:
              value: >-
                {{ [[realtime_price_mwh | float(0), state_attr('input_number.aemo_nsw_spot_price', 'max') | float(30000)] | min,
                    state_attr('input_number.aemo_nsw_spot_price', 'min') | float(-1000)] | max }}

          # Only restore if this automation actually took an override
          - condition: state
            entity_id: input_boolean.aemo_critical_override_active
            state: "on"

          - choose:
              # Ended during the cheap-rate window — restore charging mode
              - conditions:
                  - condition: time
                    after: "10:59:50"
                    before: "14:00:00"   # ← ADJUST to your cheap/free-rate window
                sequence:
                  # ← REPLACE device_id, entity_id and option
                  - device_id: YOUR_SIGEN_DEVICE_ID
                    domain: select
                    entity_id: YOUR_SIGEN_OPERATING_MODE_SELECT_ENTITY_ID
                    type: select_option
                    option: "Command Charging (Consume power from the PV first)"
                    continue_on_error: true
                  - delay: "00:00:02"
                  - action: number.set_value
                    data:
                      # 16.5 = the author's charge-rate ceiling in kW; consider reading
                      # sensor.sigen_0_inverter_1_rated_charging_power instead
                      value: >-
                        {% set rate = states('input_number.battery_charge_suggested_rate') | float(0) %}
                        {% if rate <= 0 %}
                          0
                        {% else %}
                          {{ [16.5, (rate / 0.5) | round(0, 'ceil') * 0.5] | min }}
                        {% endif %}
                    target:
                      entity_id: number.sigen_0_plant_max_charging_limit  # ← REPLACE
                    continue_on_error: true
                  - action: persistent_notification.create
                    data:
                      notification_id: aemo_critical_status
                      title: "✅ AEMO Critical Ended - Charging Restored"
                      message: >-
                        Critical event ended. Price now ${{ realtime_price_mwh }}/MWh.
                        Restored charging automation control.
                    continue_on_error: true

              # Ended during the peak window — continue normal export
              - conditions:
                  - condition: time
                    after: "17:59:50"
                    before: "20:00:00"   # ← ADJUST to your peak export window
                sequence:
                  - action: persistent_notification.create
                    data:
                      notification_id: aemo_critical_status
                      title: "✅ AEMO Critical Ended - Peak Export Active"
                      message: >-
                        Critical event ended. Price now ${{ realtime_price_mwh }}/MWh.
                        Peak export period still active - continuing normal export.
                    continue_on_error: true

            # Default: return to self-consumption
            default:
              # ← REPLACE device_id, entity_id and option
              - device_id: YOUR_SIGEN_DEVICE_ID
                domain: select
                entity_id: YOUR_SIGEN_OPERATING_MODE_SELECT_ENTITY_ID
                type: select_option
                option: "Maximum Self-consumption (Default)"
                continue_on_error: true
              - delay: "00:00:02"
              - action: number.set_value
                data:
                  value: 5  # ← REPLACE with your normal export limit in kW
                target:
                  entity_id: number.sigen_0_plant_grid_max_export_limit  # ← REPLACE
                continue_on_error: true
              - delay: "00:00:02"
              # ← REPLACE device_id and entity_id with your Remote EMS switch
              - type: turn_off
                device_id: YOUR_SIGEN_DEVICE_ID
                entity_id: YOUR_SIGEN_REMOTE_EMS_SWITCH_ENTITY_ID
                domain: switch
                continue_on_error: true
              - alias: "Wait for Remote EMS to report off before handing control back"
                wait_template: "{{ is_state('switch.sigen_0_plant_remote_ems', 'off') }}"  # ← REPLACE
                timeout: "00:00:10"
                continue_on_timeout: true
              - action: persistent_notification.create
                data:
                  notification_id: aemo_critical_status
                  title: "✅ AEMO Critical Ended - Normal Mode"
                  message: >-
                    Critical event ended. Price now ${{ realtime_price_mwh }}/MWh.
                    Returned to self-consumption mode.
                continue_on_error: true

          # Override flag goes off LAST, after the hardware has been handed back
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.aemo_critical_override_active
